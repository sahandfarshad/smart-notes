name: Build & publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Image files on GitHub Releases, for servers that cannot reach ghcr.io
  image-files:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Save images (one file per CPU type)
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository }}:latest
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch $arch docker://$IMG docker-archive:smart-notes-image-$arch.tar:$IMG
            gzip -f smart-notes-image-$arch.tar
          done
          ls -lh *.tar.gz
          for f in *.tar.gz; do [ $(stat -c%s $f) -gt 10000000 ] || { echo "$f is too small"; exit 1; }; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: server-image
          name: Server image (latest)
          make_latest: false
          files: smart-notes-image-*.tar.gz
          body: Docker image files used by install.sh when ghcr.io is not reachable from the server.
