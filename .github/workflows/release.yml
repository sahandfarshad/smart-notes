name: Package zip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r smart-notes.zip . -x '.git/*' 'node_modules/*' 'data/*'
      - uses: actions/upload-artifact@v4
        with:
          name: smart-notes
          path: smart-notes.zip
